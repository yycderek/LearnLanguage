packages:
  - "packages/*"
  - "apps/headless"
  - "apps/mobile"
  - "apps/web"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo@57.0.18
  - ws@8.21.0
  - react-server-dom-webpack@19.2.8
  - nanoid@3.3.18
overrides:
  nanoid@<3.3.18: ^3.3.18
  react-server-dom-webpack@>=19.2.0 <19.2.8: ^19.2.8
# Remove after https://github.com/cloudflare/vinext/issues/2696 is fixed upstream.
patchedDependencies:
  vinext@0.0.50: patches/vinext@0.0.50.patch
